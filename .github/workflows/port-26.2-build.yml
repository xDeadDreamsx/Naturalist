name: Fabric 26.2 Port Build

on:
  push:
    branches:
      - port/26.2-fabric
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show Gradle environment
        run: ./gradlew --version

      - name: Build Naturalist for Fabric 26.2
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload built jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: naturalist-fabric-26.2
          path: build/libs/*.jar
          if-no-files-found: error
