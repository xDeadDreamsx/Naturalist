name: Fabric 26.2 Port Build

on:
  push:
    branches:
      - port/26.2-fabric
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naturalist-26-2-port
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4

      - name: Apply Minecraft 26.2 migration pass
        shell: bash
        run: |
          python3 .github/port/migrate_26_2.py
          python3 .github/port/structural_26_2.py
          python3 .github/port/structural_26_2_3.py
          python3 .github/port/structural_26_2_4.py
          python3 .github/port/structural_26_2_5.py
          python3 .github/port/structural_26_2_6.py
          python3 .github/port/structural_26_2_7.py
          python3 .github/port/structural_26_2_8.py
          python3 .github/port/structural_26_2_9.py
          if ! git diff --quiet; then
            git config user.name "Naturalist 26.2 Port CI"
            git config user.email "actions@users.noreply.github.com"
            git add common/src/main/java fabric/src/main/java common/src/main/resources
            git commit -m "Apply Minecraft 26.2 API migration pass"
            git push origin HEAD:port/26.2-fabric
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show Gradle environment
        run: ./gradlew --version

      - name: Build Naturalist for Fabric 26.2
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Smoke-test Naturalist client startup and LambDynamicLights
        id: client_smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

          rm -rf run/crash-reports
          timeout --signal=TERM --kill-after=15s 120s xvfb-run -a ./gradlew runClient --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-client.log
          status=${PIPESTATUS[0]}

          echo "Client smoke-test exit status: $status"
          if [ -d run/crash-reports ] && find run/crash-reports -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "Minecraft produced a crash report during client startup."
            find run/crash-reports -maxdepth 1 -type f -print
            for report in run/crash-reports/*; do
              [ -f "$report" ] || continue
              echo "===== $report ====="
              cat "$report"
            done
            exit 1
          fi

          if find run -maxdepth 2 -type f -name 'hs_err_pid*.log' -print -quit 2>/dev/null | grep -q .; then
            echo "The JVM produced a fatal error log during client startup."
            find run -maxdepth 2 -type f -name 'hs_err_pid*.log' -print
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

          if ! grep -Fq 'Initializing LambDynamicLights' /tmp/naturalist-client.log; then
            echo "LambDynamicLights 26.2 was not initialized during the compatibility smoke test."
            exit 1
          fi

          if grep -Eq 'cannot add it to event naturalist:|Unknown sound event[^\n]*naturalist:' /tmp/naturalist-client.log; then
            echo "Naturalist has unresolved client sound-event resources."
            grep -En 'cannot add it to event naturalist:|Unknown sound event[^\n]*naturalist:' /tmp/naturalist-client.log || true
            exit 1
          fi

      - name: Smoke-test Naturalist dedicated server and fresh world data
        id: server_smoke
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          rm -rf run/world run/crash-reports

          timeout --signal=TERM --kill-after=15s 150s ./gradlew runServer --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-server.log
          status=${PIPESTATUS[0]}

          echo "Server smoke-test exit status: $status"
          if [ -d run/crash-reports ] && find run/crash-reports -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "Minecraft produced a crash report during dedicated-server startup."
            find run/crash-reports -maxdepth 1 -type f -print
            for report in run/crash-reports/*; do
              [ -f "$report" ] || continue
              echo "===== $report ====="
              cat "$report"
            done
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

          if ! grep -Fq 'Done (' /tmp/naturalist-server.log; then
            echo "Dedicated server never reached the ready state."
            tail -n 500 /tmp/naturalist-server.log || true
            exit 1
          fi

          if grep -Fq "Couldn't parse data file 'naturalist:" /tmp/naturalist-server.log; then
            echo "Naturalist still has datapack files that Minecraft 26.2 cannot decode."
            grep -Fn "Couldn't parse data file 'naturalist:" /tmp/naturalist-server.log || true
            exit 1
          fi

          if grep -Eq "Recipe naturalist:.*can't be placed due to empty ingredients" /tmp/naturalist-server.log; then
            echo "Naturalist still has a recipe with invalid 26.2 placement metadata."
            grep -En "Recipe naturalist:.*can't be placed due to empty ingredients" /tmp/naturalist-server.log || true
            exit 1
          fi

      - name: Smoke-test Naturalist singleplayer world join
        id: world_smoke
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf run/crash-reports

          echo "Checking for a lingering dedicated-server process before reusing its world..."
          pgrep -af '[K]notServer' || true
          if pgrep -f '[K]notServer' >/dev/null 2>&1; then
            echo "A dedicated-server process survived the timeout; terminating it before copying the world."
            pkill -TERM -f '[K]notServer' || true
            sleep 3
            pkill -KILL -f '[K]notServer' || true
          fi

          # The dedicated-server test creates run/world, but Quick Play resolves
          # singleplayer saves below run/saves. Reuse the already validated fresh
          # world as a real client save and remove the copied server session lock.
          if [ ! -d run/world ]; then
            echo "::error::The dedicated-server smoke test did not leave a world to reuse."
            exit 1
          fi
          mkdir -p run/saves
          rm -rf run/saves/world
          cp -a run/world run/saves/world
          rm -f run/saves/world/session.lock

          echo "Singleplayer save prepared at: $(pwd)/run/saves/world"
          find run/saves/world -maxdepth 2 -type f | sort | head -n 80 || true

          timeout --signal=TERM --kill-after=15s 150s xvfb-run -a ./gradlew runClient --args='--quickPlaySingleplayer world' --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-world.log
          status=${PIPESTATUS[0]}

          integrated=0
          login=0
          grep -Fq 'Starting integrated minecraft server version 26.2' /tmp/naturalist-world.log && integrated=1
          grep -Fq 'logged in with entity id' /tmp/naturalist-world.log && login=1

          echo "Singleplayer world smoke-test exit status: $status"
          echo "world_smoke_status=$status integrated_marker=$integrated login_marker=$login"
          {
            echo "### Singleplayer smoke diagnostics"
            echo "- Process exit: \`$status\`"
            if [ "$integrated" -eq 1 ]; then echo "- Integrated server marker: ✅"; else echo "- Integrated server marker: ❌"; fi
            if [ "$login" -eq 1 ]; then echo "- Player login marker: ✅"; else echo "- Player login marker: ❌"; fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -d run/crash-reports ] && find run/crash-reports -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "::error::Minecraft produced a crash report while joining the test world."
            find run/crash-reports -maxdepth 1 -type f -print
            for report in run/crash-reports/*; do
              [ -f "$report" ] || continue
              echo "===== $report ====="
              cat "$report"
            done
            exit 1
          fi

          if find run -maxdepth 2 -type f -name 'hs_err_pid*.log' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::The JVM produced a fatal error log while joining the test world."
            find run -maxdepth 2 -type f -name 'hs_err_pid*.log' -print
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 143 ]; then
            echo "::error::The singleplayer client exited unexpectedly with status $status."
          fi

          # A timeout/termination exit code is not by itself a failure here: this
          # client is intentionally stopped after the smoke-test window. What
          # matters is whether the integrated server started and the player joined.
          if [ "$integrated" -ne 1 ] || [ "$login" -ne 1 ]; then
            if [ "$integrated" -ne 1 ]; then
              echo "::error::Singleplayer smoke: integrated-server startup marker missing."
            fi
            if [ "$login" -ne 1 ]; then
              echo "::error::Singleplayer smoke: player-login marker missing."
            fi
            echo "=== Relevant singleplayer log lines ==="
            grep -nEi 'integrated|logged in|joined the game|quick.?play|starting|preparing|loading|world|session\.lock|already in use|error|exception|crash|failed|unable|disconnect' /tmp/naturalist-world.log | tail -n 300 || true
            echo "=== Last 300 singleplayer log lines ==="
            tail -n 300 /tmp/naturalist-world.log || true
            exit 1
          fi

          echo "Singleplayer Quick Play reached the integrated server and logged the player into the world."

          if grep -Fq "Couldn't parse data file 'naturalist:" /tmp/naturalist-world.log; then
            echo "::error::Naturalist datapack decoding failed during integrated-server startup."
            grep -Fn "Couldn't parse data file 'naturalist:" /tmp/naturalist-world.log || true
            exit 1
          fi

          if grep -Eq 'cannot add it to event naturalist:|Unknown sound event[^\n]*naturalist:' /tmp/naturalist-world.log; then
            echo "::error::Naturalist has unresolved resources during the in-world client test."
            grep -En 'cannot add it to event naturalist:|Unknown sound event[^\n]*naturalist:' /tmp/naturalist-world.log || true
            exit 1
          fi

      - name: Prepare singleplayer failure diagnostics
        if: steps.world_smoke.outcome == 'failure'
        shell: bash
        run: |
          rm -rf world-smoke-diagnostics
          mkdir -p world-smoke-diagnostics
          cp /tmp/naturalist-world.log world-smoke-diagnostics/naturalist-world.log 2>/dev/null || true
          cp /tmp/naturalist-server.log world-smoke-diagnostics/naturalist-server.log 2>/dev/null || true
          if [ -d run/crash-reports ]; then
            cp -a run/crash-reports world-smoke-diagnostics/crash-reports
          fi
          {
            echo "=== Save layout ==="
            find run/saves/world -maxdepth 3 -type f -print 2>/dev/null | sort || true
            echo
            echo "=== Relevant world log lines ==="
            grep -nEi 'integrated|logged in|joined the game|quick.?play|starting|preparing|loading|world|session\.lock|already in use|error|exception|crash|failed|unable|disconnect' /tmp/naturalist-world.log 2>/dev/null | tail -n 500 || true
          } > world-smoke-diagnostics/summary.txt

      - name: Upload singleplayer failure diagnostics
        if: steps.world_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: naturalist-singleplayer-diagnostics
          path: world-smoke-diagnostics/
          if-no-files-found: warn

      - name: Persist failed-build diagnostics
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "Naturalist 26.2 Port CI"
          git config user.email "actions@users.noreply.github.com"
          {
            echo "=== NATURALIST 26.2 BUILD FAILURE ==="
            tail -n 1200 /tmp/naturalist-build.log || true
          } > port-26.2-errors.txt
          git add port-26.2-errors.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record current Naturalist 26.2 build diagnostics"
            git push origin HEAD:port/26.2-fabric || true
          fi

      - name: Fail workflow if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Fail workflow if client smoke test failed
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'failure'
        run: |
          tail -n 500 /tmp/naturalist-client.log || true
          exit 1

      - name: Fail workflow if dedicated-server smoke test failed
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'failure'
        run: |
          tail -n 500 /tmp/naturalist-server.log || true
          exit 1

      - name: Fail workflow if singleplayer world smoke test failed
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'success' && steps.world_smoke.outcome == 'failure'
        run: |
          tail -n 500 /tmp/naturalist-world.log || true
          exit 1

      - name: Upload playability-tested jars
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'success' && steps.world_smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: naturalist-fabric-26.2
          path: build/libs/*.jar
          if-no-files-found: error
