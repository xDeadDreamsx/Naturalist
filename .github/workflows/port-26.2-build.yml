name: Fabric 26.2 Port Build

on:
  push:
    branches:
      - port/26.2-fabric
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naturalist-26-2-port
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show Gradle environment
        run: ./gradlew --version

      - name: Build Naturalist for Fabric 26.2
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Smoke-test Naturalist client startup and LambDynamicLights
        id: client_smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

          rm -rf run/crash-reports
          timeout --signal=TERM --kill-after=15s 120s xvfb-run -a ./gradlew runClient --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-client.log
          status=${PIPESTATUS[0]}

          echo "Client smoke-test exit status: $status"
          if [ -d run/crash-reports ] && find run/crash-reports -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "Minecraft produced a crash report during client startup."
            find run/crash-reports -maxdepth 1 -type f -print
            for report in run/crash-reports/*; do
              [ -f "$report" ] || continue
              echo "===== $report ====="
              cat "$report"
            done
            exit 1
          fi

          if find run -maxdepth 2 -type f -name 'hs_err_pid*.log' -print -quit 2>/dev/null | grep -q .; then
            echo "The JVM produced a fatal error log during client startup."
            find run -maxdepth 2 -type f -name 'hs_err_pid*.log' -print
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

          if ! grep -Fq 'Initializing LambDynamicLights' /tmp/naturalist-client.log; then
            echo "LambDynamicLights 26.2 was not initialized during the compatibility smoke test."
            exit 1
          fi

          if grep -Eq 'cannot add it to event naturalist:|Unknown sound event[^\n]*naturalist:' /tmp/naturalist-client.log; then
            echo "Naturalist has unresolved client sound-event resources."
            grep -En 'cannot add it to event naturalist:|Unknown sound event[^\n]*naturalist:' /tmp/naturalist-client.log || true
            exit 1
          fi

      - name: Inspect remaining Minecraft render API signatures
        if: always()
        shell: bash
        run: |
          minecraft_jar=$(find .gradle/loom-cache -name 'minecraft-merged-*-26.2.jar' -print -quit)
          if [ -n "$minecraft_jar" ]; then
            javap -classpath "$minecraft_jar" -p \
              net.minecraft.client.renderer.entity.EntityRenderer \
              net.minecraft.client.renderer.entity.state.EntityRenderState \
              net.minecraft.client.renderer.entity.state.HitboxRenderState \
              net.minecraft.client.renderer.entity.state.HitboxesRenderState \
              net.minecraft.client.resources.model.ModelManager \
              net.minecraft.client.renderer.item.ItemModelResolver \
              net.minecraft.client.renderer.item.ItemStackRenderState \
              > /tmp/naturalist-render-api.log 2>&1 || true
            cat /tmp/naturalist-render-api.log
          fi

      - name: Smoke-test Naturalist dedicated server and fresh world data
        id: server_smoke
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          rm -rf run/world run/crash-reports

          timeout --signal=TERM --kill-after=15s 150s ./gradlew runServer --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-server.log
          status=${PIPESTATUS[0]}

          echo "Server smoke-test exit status: $status"
          if [ -d run/crash-reports ] && find run/crash-reports -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "Minecraft produced a crash report during dedicated-server startup."
            find run/crash-reports -maxdepth 1 -type f -print
            for report in run/crash-reports/*; do
              [ -f "$report" ] || continue
              echo "===== $report ====="
              cat "$report"
            done
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

          if ! grep -Fq 'Done (' /tmp/naturalist-server.log; then
            echo "Dedicated server never reached the ready state."
            tail -n 500 /tmp/naturalist-server.log || true
            exit 1
          fi

          if grep -Fq "Couldn't parse data file 'naturalist:" /tmp/naturalist-server.log; then
            echo "Naturalist still has datapack files that Minecraft 26.2 cannot decode."
            grep -Fn "Couldn't parse data file 'naturalist:" /tmp/naturalist-server.log || true
            exit 1
          fi

          if grep -Eq "Recipe naturalist:.*can't be placed due to empty ingredients" /tmp/naturalist-server.log; then
            echo "Naturalist still has a recipe with invalid 26.2 placement metadata."
            grep -En "Recipe naturalist:.*can't be placed due to empty ingredients" /tmp/naturalist-server.log || true
            exit 1
          fi

      - name: Smoke-test Naturalist real singleplayer world with Fabric Client GameTest
        id: world_smoke
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e

          # Ensure the previous dedicated-server process cannot interfere with the
          # integrated server used by the Client GameTest.
          pgrep -af '[K]notServer' || true
          if pgrep -f '[K]notServer' >/dev/null 2>&1; then
            pkill -TERM -f '[K]notServer' || true
            sleep 3
            pkill -KILL -f '[K]notServer' || true
          fi

          rm -rf build/run/clientGameTest
          timeout --signal=TERM --kill-after=15s 210s xvfb-run -a ./gradlew runClientGameTest --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-world.log
          status=${PIPESTATUS[0]}

          echo "Fabric Client GameTest exit status: $status"

          if [ "$status" -ne 0 ]; then
            echo "::error::Fabric Client GameTest did not finish successfully (status $status)."
            tail -n 500 /tmp/naturalist-world.log || true
            exit "$status"
          fi

          if ! grep -Fq 'NATURALIST_CLIENT_GAMETEST_WORLD_JOINED' /tmp/naturalist-world.log; then
            echo "::error::The client gametest never reached a loaded singleplayer level with rendered chunks."
            grep -nEi 'gametest|singleplayer|integrated|logged in|joined|world|chunk|error|exception|crash|failed' /tmp/naturalist-world.log | tail -n 400 || true
            exit 1
          fi

          if find build/run/clientGameTest run -type f -name 'hs_err_pid*.log' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::The JVM produced a fatal error log during the client gametest."
            find build/run/clientGameTest run -type f -name 'hs_err_pid*.log' -print 2>/dev/null || true
            exit 1
          fi

          if find build/run/clientGameTest run -type f -path '*/crash-reports/*' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Minecraft produced a crash report during the client gametest."
            find build/run/clientGameTest run -type f -path '*/crash-reports/*' -print 2>/dev/null || true
            exit 1
          fi

          if grep -Fq "Couldn't parse data file 'naturalist:" /tmp/naturalist-world.log; then
            echo "::error::Naturalist datapack decoding failed in the integrated singleplayer server."
            grep -Fn "Couldn't parse data file 'naturalist:" /tmp/naturalist-world.log || true
            exit 1
          fi

          if grep -Eq "Recipe naturalist:.*can't be placed due to empty ingredients" /tmp/naturalist-world.log; then
            echo "::error::Naturalist has an invalid recipe in the integrated singleplayer server."
            grep -En "Recipe naturalist:.*can't be placed due to empty ingredients" /tmp/naturalist-world.log || true
            exit 1
          fi

          if grep -Eq 'cannot add it to event naturalist:|Unknown sound event[^\n]*naturalist:' /tmp/naturalist-world.log; then
            echo "::error::Naturalist has unresolved resources during the in-world client test."
            grep -En 'cannot add it to event naturalist:|Unknown sound event[^\n]*naturalist:' /tmp/naturalist-world.log || true
            exit 1
          fi

          echo "Fabric Client GameTest created a real singleplayer world, loaded the client level and rendered chunks successfully."

      - name: Prepare singleplayer failure diagnostics
        if: steps.world_smoke.outcome == 'failure'
        shell: bash
        run: |
          rm -rf world-smoke-diagnostics
          mkdir -p world-smoke-diagnostics
          cp /tmp/naturalist-world.log world-smoke-diagnostics/naturalist-world.log 2>/dev/null || true
          cp /tmp/naturalist-server.log world-smoke-diagnostics/naturalist-server.log 2>/dev/null || true
          if [ -d build/run/clientGameTest ]; then
            find build/run/clientGameTest -maxdepth 4 -type f -print | sort > world-smoke-diagnostics/client-gametest-files.txt || true
            if [ -d build/run/clientGameTest/crash-reports ]; then
              cp -a build/run/clientGameTest/crash-reports world-smoke-diagnostics/crash-reports
            fi
          fi
          {
            echo "=== Relevant client gametest log lines ==="
            grep -nEi 'gametest|singleplayer|integrated|logged in|joined|world|chunk|naturalist|error|exception|crash|failed|unable|disconnect' /tmp/naturalist-world.log 2>/dev/null | tail -n 700 || true
            echo
            echo "=== Last 500 client gametest log lines ==="
            tail -n 500 /tmp/naturalist-world.log 2>/dev/null || true
          } > world-smoke-diagnostics/summary.txt

      - name: Upload singleplayer failure diagnostics
        if: steps.world_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: naturalist-singleplayer-diagnostics
          path: world-smoke-diagnostics/
          if-no-files-found: warn

      - name: Upload build and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naturalist-26.2-test-logs
          path: /tmp/naturalist-*.log
          if-no-files-found: warn

      - name: Fail workflow if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Fail workflow if client smoke test failed
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'failure'
        run: |
          tail -n 500 /tmp/naturalist-client.log || true
          exit 1

      - name: Fail workflow if dedicated-server smoke test failed
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'failure'
        run: |
          tail -n 500 /tmp/naturalist-server.log || true
          exit 1

      - name: Fail workflow if singleplayer world smoke test failed
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'success' && steps.world_smoke.outcome == 'failure'
        run: |
          tail -n 500 /tmp/naturalist-world.log || true
          exit 1

      - name: Upload playability-tested jars
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'success' && steps.world_smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: naturalist-fabric-26.2
          path: build/libs/*.jar
          if-no-files-found: error
