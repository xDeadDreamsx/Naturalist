name: Fabric 26.2 Port Build

on:
  push:
    branches:
      - port/26.2-fabric
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naturalist-26-2-port
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4

      - name: Apply Minecraft 26.2 migration pass
        shell: bash
        run: |
          python3 .github/port/migrate_26_2.py
          python3 .github/port/structural_26_2.py
          python3 .github/port/structural_26_2_3.py
          python3 .github/port/structural_26_2_4.py
          python3 .github/port/structural_26_2_5.py
          python3 .github/port/structural_26_2_6.py
          python3 .github/port/structural_26_2_7.py
          python3 .github/port/structural_26_2_8.py
          python3 .github/port/structural_26_2_9.py
          if ! git diff --quiet; then
            git config user.name "Naturalist 26.2 Port CI"
            git config user.email "actions@users.noreply.github.com"
            git add common/src/main/java fabric/src/main/java
            git commit -m "Apply Minecraft 26.2 API migration pass"
            git push origin HEAD:port/26.2-fabric
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show Gradle environment
        run: ./gradlew --version

      - name: Build Naturalist for Fabric 26.2
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Smoke-test Naturalist client startup
        id: client_smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

          rm -rf run/crash-reports
          timeout --signal=TERM --kill-after=15s 120s xvfb-run -a ./gradlew runClient --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-client.log
          status=${PIPESTATUS[0]}

          echo "Client smoke-test exit status: $status"
          if [ -d run/crash-reports ] && find run/crash-reports -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "Minecraft produced a crash report during client startup."
            find run/crash-reports -maxdepth 1 -type f -print
            for report in run/crash-reports/*; do
              [ -f "$report" ] || continue
              echo "===== $report ====="
              cat "$report"
            done
            exit 1
          fi

          if find run -maxdepth 2 -type f -name 'hs_err_pid*.log' -print -quit 2>/dev/null | grep -q .; then
            echo "The JVM produced a fatal error log during client startup."
            find run -maxdepth 2 -type f -name 'hs_err_pid*.log' -print
            exit 1
          fi

          # A healthy Minecraft client normally remains open at the title screen, so GNU timeout
          # returns 124 after two minutes. A clean early exit (0) is also accepted; any other
          # status means the client failed before the smoke-test window completed.
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

      - name: Smoke-test Naturalist dedicated server and world data
        id: server_smoke
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          rm -rf run/world run/crash-reports

          timeout --signal=TERM --kill-after=15s 150s ./gradlew runServer --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-server.log
          status=${PIPESTATUS[0]}

          echo "Server smoke-test exit status: $status"
          if [ -d run/crash-reports ] && find run/crash-reports -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "Minecraft produced a crash report during dedicated-server startup."
            find run/crash-reports -maxdepth 1 -type f -print
            for report in run/crash-reports/*; do
              [ -f "$report" ] || continue
              echo "===== $report ====="
              cat "$report"
            done
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

          if ! grep -Fq 'Done (' /tmp/naturalist-server.log; then
            echo "Dedicated server never reached the ready state."
            tail -n 500 /tmp/naturalist-server.log || true
            exit 1
          fi

      - name: Inspect Minecraft 26.2 API after failed build
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          : > port-26.2-errors.txt
          exec > >(tee -a port-26.2-errors.txt) 2>&1
          echo "=== NATURALIST 26.2 COMPILE ERRORS ==="
          if [ -f /tmp/naturalist-build.log ]; then
            grep -n -E -B2 -A5 'error:|cannot find symbol|package .* does not exist|incompatible types|cannot be converted|does not override|has private access|cannot be applied|no suitable method|constructor .* cannot be applied|cannot infer type|overridden method is final' /tmp/naturalist-build.log | head -n 2200 || true
            echo
            echo "=== FULL GRADLE FAILURE TAIL ==="
            tail -n 800 /tmp/naturalist-build.log || true
          fi
          echo
          echo "=== MINECRAFT 26.2 API INSPECTION ==="
          python3 - <<'PY'
          import pathlib, zipfile
          targets = {
              'TextureSheetParticle', 'SingleQuadParticle', 'DiggerItem', 'SwordItem', 'LightTexture',
              'Saddleable', 'Boat', 'ThrowableItemProjectile', 'InstantaneousMobEffect',
              'ItemInteractionResult', 'InteractionResultHolder', 'ItemNameBlockItem',
              'ClampedItemPropertyFunction', 'ItemProperties', 'Input', 'GuiGraphics',
              'GuiGraphicsExtractor', 'SimpleCriterionTrigger', 'ContextAwarePredicate', 'ItemPredicate',
              'ChunkSectionLayerMap', 'RecipeSerializer', 'NeutralMob', 'LivingEntity', 'EntityType',
              'ContainerHelper', 'ResourceKey', 'InteractionResult', 'ValueInput', 'ValueOutput'
          }
          patterns = ('TextureSheet', 'SingleQuad', 'Saddle', 'Boat', 'InteractionResult', 'ItemPropert',
                      'Criterion', 'Predicate', 'ChunkSectionLayer', 'GuiGraphics', 'Digger', 'SwordItem',
                      'ThrowableItem', 'Instantaneous', 'Input', 'ValueInput', 'ValueOutput')
          hits = {t: [] for t in targets}
          nearby = []
          jars = list(pathlib.Path.home().joinpath('.gradle').rglob('*.jar'))
          for jar in jars:
              try:
                  with zipfile.ZipFile(jar) as zf:
                      for name in zf.namelist():
                          if not name.endswith('.class'):
                              continue
                          simple = name.rsplit('/', 1)[-1][:-6]
                          if simple in hits and len(hits[simple]) < 10:
                              hits[simple].append((jar, name))
                          if any(p.lower() in simple.lower() for p in patterns) and len(nearby) < 500:
                              nearby.append((jar, name))
              except Exception:
                  pass
          for target in sorted(targets):
              print(f'=== EXACT {target} ===')
              for jar, name in hits[target]:
                  print(f'{name} @ {jar}')
          print('=== RELATED CLASS NAMES ===')
          for jar, name in nearby:
              print(f'{name} @ {jar}')
          mc_jars = []
          for jar in jars:
              try:
                  with zipfile.ZipFile(jar) as zf:
                      if 'net/minecraft/world/entity/LivingEntity.class' in zf.namelist():
                          mc_jars.append(jar)
              except Exception:
                  pass
          print('=== MINECRAFT JARS ===')
          for jar in mc_jars:
              print(jar)
          if mc_jars:
              pathlib.Path('/tmp/naturalist_mcjar').write_text(str(mc_jars[0]))
          PY
          if [ -f /tmp/naturalist_mcjar ]; then
            MCJAR="$(cat /tmp/naturalist_mcjar)"
            for C in \
              net.minecraft.world.InteractionResult \
              net.minecraft.world.entity.NeutralMob \
              net.minecraft.world.entity.LivingEntity \
              net.minecraft.world.entity.Mob \
              net.minecraft.world.entity.EntityType \
              net.minecraft.world.ContainerHelper \
              net.minecraft.resources.ResourceKey \
              net.minecraft.world.level.storage.ValueInput \
              net.minecraft.world.level.storage.ValueOutput \
              net.minecraft.world.item.crafting.RecipeSerializer; do
              echo "=== JAVAP $C ==="
              javap -classpath "$MCJAR" -public "$C" || true
            done
          fi

      - name: Persist failed-build diagnostics
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "Naturalist 26.2 Port CI"
          git config user.email "actions@users.noreply.github.com"
          git add port-26.2-errors.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record current Naturalist 26.2 build diagnostics"
            git push origin HEAD:port/26.2-fabric || true
          fi

      - name: Fail workflow if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Fail workflow if client smoke test failed
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'failure'
        run: |
          if [ -f /tmp/naturalist-client.log ]; then
            echo "===== CLIENT STARTUP LOG TAIL ====="
            tail -n 500 /tmp/naturalist-client.log
          fi
          exit 1

      - name: Fail workflow if dedicated-server smoke test failed
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'failure'
        run: |
          if [ -f /tmp/naturalist-server.log ]; then
            echo "===== SERVER STARTUP LOG TAIL ====="
            tail -n 500 /tmp/naturalist-server.log
          fi
          exit 1

      - name: Upload built jars
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: naturalist-fabric-26.2
          path: build/libs/*.jar
          if-no-files-found: error
