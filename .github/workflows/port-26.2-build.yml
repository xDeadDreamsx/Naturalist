name: Fabric 26.2 Port Build

on:
  push:
    branches:
      - port/26.2-fabric
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naturalist-26-2-port
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4

      - name: Apply Minecraft 26.2 migration pass
        shell: bash
        run: |
          python3 .github/port/migrate_26_2.py
          python3 .github/port/structural_26_2.py
          python3 .github/port/structural_26_2_3.py
          python3 .github/port/structural_26_2_4.py
          python3 .github/port/structural_26_2_5.py
          python3 .github/port/structural_26_2_6.py
          python3 .github/port/structural_26_2_7.py
          python3 .github/port/structural_26_2_8.py
          python3 .github/port/structural_26_2_9.py
          if ! git diff --quiet; then
            git config user.name "Naturalist 26.2 Port CI"
            git config user.email "actions@users.noreply.github.com"
            git add common/src/main/java fabric/src/main/java common/src/main/resources
            git commit -m "Apply Minecraft 26.2 API migration pass"
            git push origin HEAD:port/26.2-fabric
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show Gradle environment
        run: ./gradlew --version

      - name: Build Naturalist for Fabric 26.2
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Smoke-test Naturalist client startup and LambDynamicLights
        id: client_smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

          rm -rf run/crash-reports
          timeout --signal=TERM --kill-after=15s 120s xvfb-run -a ./gradlew runClient --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-client.log
          status=${PIPESTATUS[0]}

          echo "Client smoke-test exit status: $status"
          if [ -d run/crash-reports ] && find run/crash-reports -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "Minecraft produced a crash report during client startup."
            find run/crash-reports -maxdepth 1 -type f -print
            for report in run/crash-reports/*; do
              [ -f "$report" ] || continue
              echo "===== $report ====="
              cat "$report"
            done
            exit 1
          fi

          if find run -maxdepth 2 -type f -name 'hs_err_pid*.log' -print -quit 2>/dev/null | grep -q .; then
            echo "The JVM produced a fatal error log during client startup."
            find run -maxdepth 2 -type f -name 'hs_err_pid*.log' -print
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

          if ! grep -Fq 'Initializing LambDynamicLights' /tmp/naturalist-client.log; then
            echo "LambDynamicLights 26.2 was not initialized during the compatibility smoke test."
            exit 1
          fi

          if grep -Eq 'cannot add it to event naturalist:|Unknown sound event[^\n]*naturalist:' /tmp/naturalist-client.log; then
            echo "Naturalist has unresolved client sound-event resources."
            grep -En 'cannot add it to event naturalist:|Unknown sound event[^\n]*naturalist:' /tmp/naturalist-client.log || true
            exit 1
          fi

      - name: Smoke-test Naturalist dedicated server and fresh world data
        id: server_smoke
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          rm -rf run/world run/crash-reports

          timeout --signal=TERM --kill-after=15s 150s ./gradlew runServer --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-server.log
          status=${PIPESTATUS[0]}

          echo "Server smoke-test exit status: $status"
          if [ -d run/crash-reports ] && find run/crash-reports -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "Minecraft produced a crash report during dedicated-server startup."
            find run/crash-reports -maxdepth 1 -type f -print
            for report in run/crash-reports/*; do
              [ -f "$report" ] || continue
              echo "===== $report ====="
              cat "$report"
            done
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

          if ! grep -Fq 'Done (' /tmp/naturalist-server.log; then
            echo "Dedicated server never reached the ready state."
            tail -n 500 /tmp/naturalist-server.log || true
            exit 1
          fi

          if grep -Fq "Couldn't parse data file 'naturalist:" /tmp/naturalist-server.log; then
            echo "Naturalist still has datapack files that Minecraft 26.2 cannot decode."
            grep -Fn "Couldn't parse data file 'naturalist:" /tmp/naturalist-server.log || true
            exit 1
          fi

          if grep -Eq "Recipe naturalist:.*can't be placed due to empty ingredients" /tmp/naturalist-server.log; then
            echo "Naturalist still has a recipe with invalid 26.2 placement metadata."
            grep -En "Recipe naturalist:.*can't be placed due to empty ingredients" /tmp/naturalist-server.log || true
            exit 1
          fi

      - name: Smoke-test Naturalist singleplayer world join
        id: world_smoke
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf run/crash-reports

          timeout --signal=TERM --kill-after=15s 150s xvfb-run -a ./gradlew runClient --args='--quickPlaySingleplayer world' --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-world.log
          status=${PIPESTATUS[0]}

          echo "Singleplayer world smoke-test exit status: $status"
          if [ -d run/crash-reports ] && find run/crash-reports -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "Minecraft produced a crash report while joining the test world."
            find run/crash-reports -maxdepth 1 -type f -print
            for report in run/crash-reports/*; do
              [ -f "$report" ] || continue
              echo "===== $report ====="
              cat "$report"
            done
            exit 1
          fi

          if find run -maxdepth 2 -type f -name 'hs_err_pid*.log' -print -quit 2>/dev/null | grep -q .; then
            echo "The JVM produced a fatal error log while joining the test world."
            find run -maxdepth 2 -type f -name 'hs_err_pid*.log' -print
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

          if ! grep -Fq 'Starting integrated minecraft server version 26.2' /tmp/naturalist-world.log; then
            echo "Quick Play never started the Minecraft 26.2 integrated server."
            tail -n 500 /tmp/naturalist-world.log || true
            exit 1
          fi

          if ! grep -Fq 'logged in with entity id' /tmp/naturalist-world.log; then
            echo "The test player never successfully entered the singleplayer world."
            tail -n 500 /tmp/naturalist-world.log || true
            exit 1
          fi

          if grep -Fq "Couldn't parse data file 'naturalist:" /tmp/naturalist-world.log; then
            echo "Naturalist datapack decoding failed during integrated-server startup."
            grep -Fn "Couldn't parse data file 'naturalist:" /tmp/naturalist-world.log || true
            exit 1
          fi

          if grep -Eq 'cannot add it to event naturalist:|Unknown sound event[^\n]*naturalist:' /tmp/naturalist-world.log; then
            echo "Naturalist has unresolved resources during the in-world client test."
            grep -En 'cannot add it to event naturalist:|Unknown sound event[^\n]*naturalist:' /tmp/naturalist-world.log || true
            exit 1
          fi

      - name: Persist failed-build diagnostics
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "Naturalist 26.2 Port CI"
          git config user.email "actions@users.noreply.github.com"
          {
            echo "=== NATURALIST 26.2 BUILD FAILURE ==="
            tail -n 1200 /tmp/naturalist-build.log || true
          } > port-26.2-errors.txt
          git add port-26.2-errors.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record current Naturalist 26.2 build diagnostics"
            git push origin HEAD:port/26.2-fabric || true
          fi

      - name: Fail workflow if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Fail workflow if client smoke test failed
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'failure'
        run: |
          tail -n 500 /tmp/naturalist-client.log || true
          exit 1

      - name: Fail workflow if dedicated-server smoke test failed
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'failure'
        run: |
          tail -n 500 /tmp/naturalist-server.log || true
          exit 1

      - name: Fail workflow if singleplayer world smoke test failed
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'success' && steps.world_smoke.outcome == 'failure'
        run: |
          tail -n 500 /tmp/naturalist-world.log || true
          exit 1

      - name: Upload playability-tested jars
        if: steps.build.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'success' && steps.world_smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: naturalist-fabric-26.2
          path: build/libs/*.jar
          if-no-files-found: error
