name: Fabric 26.2 Port Build

on:
  push:
    branches:
      - port/26.2-fabric
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4

      - name: Apply safe mechanical 26.2 migrations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('common/src/main/java'), Path('fabric/src/main/java')]
          replacements = {
              'import net.minecraft.world.level.GameRules;':
                  'import net.minecraft.world.level.gamerules.GameRules;',
              'import net.minecraft.advancements.CriteriaTriggers;':
                  'import net.minecraft.advancements.triggers.CriteriaTriggers;',
              'import net.minecraft.client.renderer.RenderType;':
                  'import net.minecraft.client.renderer.rendertype.RenderTypes;',
              'RenderType::entityCutout': 'RenderTypes::entityCutoutCull',
              'RenderType::entityTranslucent': 'RenderTypes::entityTranslucent',
          }

          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.java'):
                  text = path.read_text(encoding='utf-8')
                  migrated = text
                  for old, new in replacements.items():
                      migrated = migrated.replace(old, new)
                  migrated = migrated.replace('import net.minecraft.client.renderer.LightTexture;\n', '')
                  if migrated != text:
                      path.write_text(migrated, encoding='utf-8')
                      changed.append(str(path))
          print('Mechanical migrations changed', len(changed), 'files')
          for path in changed:
              print(path)
          PY
          if ! git diff --quiet; then
            git config user.name "Naturalist 26.2 Port CI"
            git config user.email "actions@users.noreply.github.com"
            git add common/src/main/java fabric/src/main/java
            git commit -m "Apply safe Minecraft 26.2 package migrations"
            git push origin HEAD:port/26.2-fabric
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show Gradle environment
        run: ./gradlew --version

      - name: Build Naturalist for Fabric 26.2
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee /tmp/naturalist-build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Inspect Minecraft 26.2 API after failed compile
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          : > port-26.2-errors.txt
          exec > >(tee -a port-26.2-errors.txt) 2>&1
          echo "=== NATURALIST 26.2 COMPILE ERRORS ==="
          if [ -f /tmp/naturalist-build.log ]; then
            grep -n -E -B2 -A5 'error:|cannot find symbol|package .* does not exist|incompatible types|cannot be converted|does not override|has private access|cannot be applied|no suitable method|constructor .* cannot be applied|cannot infer type' /tmp/naturalist-build.log | head -n 1800 || true
          fi
          echo
          echo "=== MINECRAFT 26.2 API INSPECTION ==="
          python3 - <<'PY'
          import pathlib, zipfile
          targets = {
              'TextureSheetParticle', 'DiggerItem', 'SwordItem', 'LightTexture',
              'Saddleable', 'Boat', 'ThrowableItemProjectile', 'InstantenousMobEffect',
              'InstantaneousMobEffect', 'ItemInteractionResult', 'InteractionResultHolder',
              'ItemNameBlockItem', 'ClampedItemPropertyFunction', 'ItemProperties', 'Input',
              'GuiGraphics', 'SimpleCriterionTrigger', 'ContextAwarePredicate', 'ItemPredicate',
              'ChunkSectionLayerMap', 'RecipeSerializer', 'NeutralMob', 'LivingEntity',
              'EntityType', 'ContainerHelper', 'ResourceKey', 'InteractionResult'
          }
          patterns = ('TextureSheet', 'Saddle', 'Boat', 'InteractionResult', 'ItemPropert',
                      'Criterion', 'Predicate', 'ChunkSectionLayer', 'GuiGraphics', 'Digger',
                      'SwordItem', 'ThrowableItem', 'Instantaneous', 'Input')
          hits = {t: [] for t in targets}
          nearby = []
          jars = list(pathlib.Path.home().joinpath('.gradle').rglob('*.jar'))
          for jar in jars:
              try:
                  with zipfile.ZipFile(jar) as zf:
                      for name in zf.namelist():
                          if not name.endswith('.class'):
                              continue
                          simple = name.rsplit('/', 1)[-1][:-6]
                          if simple in hits and len(hits[simple]) < 10:
                              hits[simple].append((jar, name))
                          if any(p.lower() in simple.lower() for p in patterns) and len(nearby) < 350:
                              nearby.append((jar, name))
              except Exception:
                  pass
          for target in sorted(targets):
              print(f'=== EXACT {target} ===')
              for jar, name in hits[target]:
                  print(f'{name} @ {jar}')
          print('=== RELATED CLASS NAMES ===')
          for jar, name in nearby:
              print(f'{name} @ {jar}')
          mc_jars = []
          for jar in jars:
              try:
                  with zipfile.ZipFile(jar) as zf:
                      if 'net/minecraft/world/entity/LivingEntity.class' in zf.namelist():
                          mc_jars.append(jar)
              except Exception:
                  pass
          print('=== MINECRAFT JARS ===')
          for jar in mc_jars:
              print(jar)
          if mc_jars:
              pathlib.Path('/tmp/naturalist_mcjar').write_text(str(mc_jars[0]))
          PY
          if [ -f /tmp/naturalist_mcjar ]; then
            MCJAR="$(cat /tmp/naturalist_mcjar)"
            for C in \
              net.minecraft.world.InteractionResult \
              net.minecraft.world.entity.NeutralMob \
              net.minecraft.world.entity.LivingEntity \
              net.minecraft.world.entity.EntityType \
              net.minecraft.world.ContainerHelper \
              net.minecraft.resources.ResourceKey \
              net.minecraft.world.item.crafting.RecipeSerializer; do
              echo "=== JAVAP $C ==="
              javap -classpath "$MCJAR" -public "$C" || true
            done
          fi

      - name: Persist failed-build diagnostics
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "Naturalist 26.2 Port CI"
          git config user.email "actions@users.noreply.github.com"
          git add port-26.2-errors.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record current Naturalist 26.2 compile errors"
            git push origin HEAD:port/26.2-fabric
          fi

      - name: Fail workflow if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload built jars
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: naturalist-fabric-26.2
          path: build/libs/*.jar
          if-no-files-found: error
