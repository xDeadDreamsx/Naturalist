plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-${project.mod_version}-fabric-${project.minecraft_version}"
}

sourceSets {
    main {
        java {
            srcDirs = ['common/src/main/java', 'fabric/src/main/java']
            exclude 'com/crispytwig/naturalist/compat/fieldguide/**'
        }
        resources {
            srcDirs = ['common/src/main/resources', 'fabric/src/main/resources']
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        name = 'Gegy'
        url = 'https://maven.gegy.dev'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional integration: compile against LambDynamicLights' Java API only.
    // The actual LambDynamicLights mod is not bundled and remains optional at runtime.
    compileOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:4.12.4+26.2"

    compileOnly "org.jetbrains:annotations:26.0.2"
    compileOnly "org.jspecify:jspecify:1.0.0"
}

loom {
    accessWidenerPath = file('common/src/main/resources/naturalist.accesswidener')
}

processResources {
    def expandProps = [
        version: project.mod_version,
        minecraft_version: project.minecraft_version,
        fabric_loader_version: project.fabric_loader_version,
        fabric_api_version: project.fabric_api_version
    ]
    inputs.properties(expandProps)
    filesMatching('fabric.mod.json') {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    // Keep the porting CI useful while many 26.2 API breaks are being migrated.
    options.compilerArgs += ['-Xmaxerrs', '1000', '-Xdiags:verbose']
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.mod_id}" }
    }
}
