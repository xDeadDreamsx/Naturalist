import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.util.zip.ZipFile

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-${project.mod_version}-fabric-${project.minecraft_version}"
}

sourceSets {
    main {
        java {
            srcDirs = ['common/src/main/java', 'fabric/src/main/java']
            exclude 'com/crispytwig/naturalist/compat/fieldguide/**'
        }
        resources {
            srcDirs = ['common/src/main/resources', 'fabric/src/main/resources']
            // Minecraft 26.2 no longer uses Naturalist's legacy template_spawn_egg models.
            // Replaced versions are generated below and added after the normal resources.
            exclude 'assets/naturalist/models/item/*_spawn_egg.json'
            exclude 'assets/naturalist/textures/item/*_spawn_egg.png'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        name = 'Gegy'
        url = 'https://maven.gegy.dev'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:4.12.4+26.2"
    runtimeOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-runtime:4.12.4+26.2"

    compileOnly "org.jetbrains:annotations:26.0.2"
    compileOnly "org.jspecify:jspecify:1.0.0"
}

loom {
    accessWidenerPath = file('common/src/main/resources/naturalist.accesswidener')
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "naturalist-client-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

def generated26_2ClientResourcesDir = layout.buildDirectory.dir('generated/26.2-client-resources')

tasks.register('generate26_2ClientResources') {
    def itemModelDir = layout.projectDirectory.dir('common/src/main/resources/assets/naturalist/models/item')
    def customEggModelDir = layout.projectDirectory.dir('common/src/main/resources/resourcepacks/custom_spawn_eggs/assets/naturalist/models/item')
    def customEggTextureDir = layout.projectDirectory.dir('common/src/main/resources/resourcepacks/custom_spawn_eggs/assets/naturalist/textures/item')

    inputs.dir(itemModelDir)
    inputs.dir(customEggModelDir)
    inputs.dir(customEggTextureDir)
    outputs.dir(generated26_2ClientResourcesDir)

    doLast {
        def outputRoot = generated26_2ClientResourcesDir.get().asFile
        delete(outputRoot)

        def clientItemDir = new File(outputRoot, 'assets/naturalist/items')
        def generatedModelDir = new File(outputRoot, 'assets/naturalist/models/item')
        def generatedTextureDir = new File(outputRoot, 'assets/naturalist/textures/item')
        clientItemDir.mkdirs()
        generatedModelDir.mkdirs()
        generatedTextureDir.mkdirs()

        def vanillaEggFallbacks = [
                capybara_spawn_egg: 'minecraft:item/pig_spawn_egg',
                hedgehog_spawn_egg: 'minecraft:item/armadillo_spawn_egg',
                turkey_spawn_egg  : 'minecraft:item/chicken_spawn_egg',
                whale_spawn_egg   : 'minecraft:item/dolphin_spawn_egg'
        ]

        def snailColors = ['white', 'orange', 'magenta', 'light_blue', 'yellow', 'lime', 'pink', 'gray',
                           'light_gray', 'cyan', 'purple', 'blue', 'brown', 'green', 'red', 'black']

        itemModelDir.asFile.eachFileMatch(~/.*\.json/) { File modelFile ->
            def itemName = modelFile.name.substring(0, modelFile.name.length() - 5)

            def clientItem
            if (itemName == 'snail' || itemName == 'snail_shell') {
                def entries = []
                snailColors.eachWithIndex { color, index ->
                    entries << [
                            threshold: index / 15.0F,
                            model: [
                                    type : 'minecraft:model',
                                    model: "naturalist:item/${itemName}/${color}"
                            ]
                    ]
                }
                clientItem = [
                        model: [
                                type    : 'minecraft:range_dispatch',
                                property: 'naturalist:snail_color',
                                fallback: [type: 'minecraft:model', model: "naturalist:item/${itemName}/white"],
                                entries : entries
                        ]
                ]
            } else if (itemName == 'knapsack') {
                clientItem = [
                        model: [
                                type    : 'minecraft:condition',
                                property: 'naturalist:knapsack_filled',
                                on_true : [type: 'minecraft:model', model: 'naturalist:item/knapsack_filled'],
                                on_false: [type: 'minecraft:model', model: 'naturalist:item/knapsack']
                        ]
                ]
            } else {
                clientItem = [
                        model: [
                                type : 'minecraft:model',
                                model: "naturalist:item/${itemName}"
                        ]
                ]
            }

            new File(clientItemDir, "${itemName}.json").text =
                    JsonOutput.prettyPrint(JsonOutput.toJson(clientItem)) + '\n'

            if (!itemName.endsWith('_spawn_egg')) {
                return
            }

            String textureId = null
            def customModel = new File(customEggModelDir.asFile, modelFile.name)
            if (customModel.isFile()) {
                def parsed = new JsonSlurper().parse(customModel)
                def candidate = parsed?.textures?.layer0
                if (candidate instanceof String && candidate.startsWith('naturalist:item/')) {
                    def textureName = candidate.substring('naturalist:item/'.length())
                    if (new File(customEggTextureDir.asFile, "${textureName}.png").isFile()) {
                        textureId = candidate
                    }
                }
            }

            if (textureId == null && new File(customEggTextureDir.asFile, "${itemName}.png").isFile()) {
                textureId = "naturalist:item/${itemName}"
            }
            if (textureId == null) {
                textureId = vanillaEggFallbacks[itemName]
            }
            if (textureId == null) {
                throw new GradleException("No Minecraft 26.2 texture mapping exists for Naturalist spawn egg ${itemName}")
            }

            def spawnEggModel = [
                    parent  : 'minecraft:item/generated',
                    textures: [layer0: textureId]
            ]
            new File(generatedModelDir, "${itemName}.json").text =
                    JsonOutput.prettyPrint(JsonOutput.toJson(spawnEggModel)) + '\n'
        }

        copy {
            from(customEggTextureDir.asFile)
            include '*_spawn_egg.png'
            into generatedTextureDir
        }
    }
}

processResources {
    dependsOn tasks.named('generate26_2ClientResources')
    from(generated26_2ClientResourcesDir)

    def expandProps = [
        version: project.mod_version,
        minecraft_version: project.minecraft_version,
        fabric_loader_version: project.fabric_loader_version,
        fabric_api_version: project.fabric_api_version
    ]
    inputs.properties(expandProps)
    filesMatching('fabric.mod.json') {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '1000', '-Xdiags:verbose']
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.mod_id}" }
    }
}

tasks.register('verify26_2PackagedClientResources') {
    dependsOn tasks.named('jar')

    doLast {
        def jarTask = tasks.named('jar').get()
        def jarFile = jarTask.archiveFile.get().asFile
        def zip = new ZipFile(jarFile)
        try {
            def entries = java.util.Collections.list(zip.entries())
            def clientItemCount = entries.count { it.name.startsWith('assets/naturalist/items/') && it.name.endsWith('.json') }
            if (clientItemCount < 100) {
                throw new GradleException("Minecraft 26.2 client item definitions were not packaged (found ${clientItemCount})")
            }

            def required = [
                    'assets/naturalist/items/elephant_spawn_egg.json',
                    'assets/naturalist/models/item/elephant_spawn_egg.json',
                    'assets/naturalist/textures/item/elephant_spawn_egg.png',
                    'assets/naturalist/items/snail.json',
                    'assets/naturalist/items/snail_shell.json',
                    'assets/naturalist/items/knapsack.json'
            ]
            required.each { path ->
                if (zip.getEntry(path) == null) {
                    throw new GradleException("Required Minecraft 26.2 client resource missing from final JAR: ${path}")
                }
            }

            def modelEntry = zip.getEntry('assets/naturalist/models/item/elephant_spawn_egg.json')
            def modelText = zip.getInputStream(modelEntry).getText('UTF-8')
            if (modelText.contains('template_spawn_egg') || !modelText.contains('minecraft:item/generated')) {
                throw new GradleException('Elephant spawn egg still uses the pre-26.2 item model format')
            }

            def snailItemText = zip.getInputStream(zip.getEntry('assets/naturalist/items/snail.json')).getText('UTF-8')
            if (!snailItemText.contains('naturalist:snail_color')) {
                throw new GradleException('Snail color client-item parity definition was not packaged')
            }
            def knapsackItemText = zip.getInputStream(zip.getEntry('assets/naturalist/items/knapsack.json')).getText('UTF-8')
            if (!knapsackItemText.contains('naturalist:knapsack_filled')) {
                throw new GradleException('Knapsack filled client-item parity definition was not packaged')
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('build').configure {
    dependsOn tasks.named('verify26_2PackagedClientResources')
}
