import groovy.json.JsonOutput

architectury {
    common rootProject.enabled_platforms.split(",")
}

loom {
    accessWidenerPath = file("src/main/resources/naturalist.accesswidener")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modCompileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${project.lambdynamiclights}")

    modCompileOnly "maven.modrinth:field-guide:${project.field_guide_fabric}"

    compileOnly "org.jetbrains:annotations:24.1.0"
    compileOnly "org.jspecify:jspecify:1.0.0"
}

// Minecraft 26.2 resolves an item's appearance through assets/<namespace>/items/*.json.
// The 1.21.1 source only ships the legacy models/item/*.json files, so generate the
// simple client-item indirection for every top-level Naturalist item model at build time.
def generatedClientItemsDir = layout.buildDirectory.dir("generated/client-item-definitions")

tasks.register("generateClientItemDefinitions") {
    def modelDir = layout.projectDirectory.dir("src/main/resources/assets/naturalist/models/item")
    inputs.dir(modelDir)
    outputs.dir(generatedClientItemsDir)

    doLast {
        def outputRoot = generatedClientItemsDir.get().asFile
        delete(outputRoot)
        def itemDir = new File(outputRoot, "assets/naturalist/items")
        itemDir.mkdirs()

        modelDir.asFile.eachFileMatch(~/.*\.json/) { File modelFile ->
            def itemName = modelFile.name.substring(0, modelFile.name.length() - 5)
            def clientItem = [
                    model: [
                            type : "minecraft:model",
                            model: "naturalist:item/${itemName}"
                    ]
            ]
            new File(itemDir, "${itemName}.json").text = JsonOutput.prettyPrint(JsonOutput.toJson(clientItem)) + "\n"
        }
    }
}

sourceSets.main.resources.srcDir(generatedClientItemsDir)
tasks.named("processResources").configure {
    dependsOn(tasks.named("generateClientItemDefinitions"))
}
