plugins {
    id "com.gradleup.shadow" version "8.3.11"
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        client {
            client()
            ideConfigGenerated true
            runDir "run"
        }
        server {
            server()
            ideConfigGenerated true
            runDir "run"
        }
    }
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

configurations.configureEach {
    resolutionStrategy.force "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"


    modCompileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${project.lambdynamiclights_version}")
    modLocalRuntime("dev.lambdaurora.lambdynamiclights:lambdynamiclights-runtime:${project.lambdynamiclights_version}")

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")

    modCompileOnly "maven.modrinth:justenoughbreeding:${project.justenoughbreeding_fabric_version}"
    modLocalRuntime "maven.modrinth:justenoughbreeding:${project.justenoughbreeding_fabric_version}"

    modCompileOnly "maven.modrinth:emi:${project.emi_fabric_version}"
    modLocalRuntime "maven.modrinth:emi:${project.emi_fabric_version}"

    modLocalRuntime "maven.modrinth:field-guide:${project.field_guide_fabric_version}"

    modLocalRuntime "maven.modrinth:immersive-overlays:${project.immersive_overlays_version}-fabric"

    modLocalRuntime "maven.modrinth:not-enough-animations:${project.not_enough_animations_fabric_version}"
}

processResources {
    def expandProps = [
            "version"                : project.mod_version,
            "mod_id"                 : project.mod_id,
            "mod_name"               : project.mod_name,
            "mod_license"            : project.mod_license,
            "mod_description"        : project.mod_description,
            "mod_authors"            : project.mod_authors,
            "minecraft_version"      : project.minecraft_version,
            "fabric_loader_version"  : project.fabric_loader_version,
            "fabric_api_version"     : project.fabric_api_version
    ]

    filesMatching("fabric.mod.json") {
        expand expandProps
    }
    inputs.properties(expandProps)
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

remapJar {
    input.set shadowJar.archiveFile
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

publishMods {
    file = remapJar.archiveFile
    type = STABLE
    version = "${project.mod_version}+${project.minecraft_version}-fabric"
    changelog = rootProject.file("CHANGELOG.md").text
    modLoaders.add("fabric")
    displayName = "${project.mod_name} ${project.mod_version} (Fabric ${project.minecraft_version})"

    curseforge {
        projectId = project.curseforge
        accessToken = providers.gradleProperty("curseforgeToken").orElse(providers.environmentVariable("CURSEFORGE_TOKEN"))
        minecraftVersions.add(project.minecraft_version)
        clientRequired = true
        serverRequired = true
        requires("fabric-api")
    }

    modrinth {
        projectId = project.modrinth
        accessToken = providers.gradleProperty("modrinthToken").orElse(providers.environmentVariable("MODRINTH_TOKEN"))
        minecraftVersions.add(project.minecraft_version)
        requires("fabric-api")
    }
}
